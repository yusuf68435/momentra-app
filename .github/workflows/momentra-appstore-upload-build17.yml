name: Momentra App Store Upload Build 17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Download signed IPA
        run: curl --fail --location --retry 3 --output Momentra-17.ipa 'https://expo.dev/artifacts/eas/4WouCchlRoHnjK6jHRNR_ZlUTyhJItSDOaYyYfT_2II.ipa'

      - name: Configure App Store Connect API key
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_P752C956D4.p8"
          cp "$HOME/private_keys/AuthKey_P752C956D4.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_P752C956D4.p8"
          chmod 600 "$HOME/private_keys/AuthKey_P752C956D4.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_P752C956D4.p8"

      - name: Upload build 17 to App Store Connect
        run: xcrun altool --upload-app --type ios --file Momentra-17.ipa --apiKey P752C956D4 --apiIssuer 0c203279-bcf4-49ec-8e75-40b7618c5f94