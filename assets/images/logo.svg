<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background: warm ivory gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="100%" stop-color="#EDE7DA"/>
    </linearGradient>
    <!-- Subtle inner glow (gold warmth) -->
    <radialGradient id="bgGlow" cx="36%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#d4af60" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d4af60" stop-opacity="0"/>
    </radialGradient>
    <!-- M letter: daytime gold gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse"
      x1="148" y1="185" x2="364" y2="345">
      <stop offset="0%" stop-color="#9A7420"/>
      <stop offset="50%" stop-color="#7A5C11"/>
      <stop offset="100%" stop-color="#5C4409"/>
    </linearGradient>
    <!-- Sparkle: bright gold -->
    <radialGradient id="sparkGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d4af60"/>
      <stop offset="100%" stop-color="#B8942E"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <!-- Inner warm glow -->
  <circle cx="195" cy="165" r="215" fill="url(#bgGlow)"/>
  <!-- Border frame: gold at 35% opacity -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="113.5" fill="none"
    stroke="#B8942E" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- M letter (stroke, daytime gold gradient) -->
  <g fill="none" stroke="url(#mGrad)" stroke-width="30"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.97">
    <line x1="148" y1="345" x2="148" y2="185"/>
    <line x1="148" y1="185" x2="256" y2="278"/>
    <line x1="256" y1="278" x2="364" y2="185"/>
    <line x1="364" y1="185" x2="364" y2="345"/>
  </g>

  <!-- Main top sparkle -->
  <g fill="url(#sparkGrad)" transform="translate(256,106) scale(0.90)">
    <path d="M0,-24 L4,-7 L20,-10 L8,2 L14,18 L0,10 L-14,18 L-8,2 L-20,-10 L-4,-7 Z"/>
  </g>
  <!-- Small right sparkle -->
  <g fill="url(#sparkGrad)" opacity="0.75" transform="translate(372,120) scale(0.55)">
    <path d="M0,-24 L4,-7 L20,-10 L8,2 L14,18 L0,10 L-14,18 L-8,2 L-20,-10 L-4,-7 Z"/>
  </g>
  <!-- Small left sparkle -->
  <g fill="url(#sparkGrad)" opacity="0.65" transform="translate(152,138) scale(0.42)">
    <path d="M0,-24 L4,-7 L20,-10 L8,2 L14,18 L0,10 L-14,18 L-8,2 L-20,-10 L-4,-7 Z"/>
  </g>
</svg>
